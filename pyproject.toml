[project]
name = "holoeml-processing"
version = "0.4.0"
description = "Process experimental data from holoeml project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "RodionovSA", email = "sergeyrodionov93@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "torch>=2.12",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "phase-shift",
    "dispertorch",
    "ridb",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
# GPU backend for phase-shift; see the `cuda` extra in phase-shift's
# pyproject.toml for choosing the CUDA wheel that matches your GPU/driver.
cuda = ["phase-shift[cuda]"]

[project.urls]
Repository = "https://github.com/RodionovSA/holoeml-processing"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
phase-shift = { git = "https://github.com/RodionovSA/phase-shift" }
dispertorch = { git = "https://github.com/RodionovSA/dispertorch" }
ridb = { git = "https://github.com/RodionovSA/ridb" }
