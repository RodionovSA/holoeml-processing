# PhaseSolver configuration (see phase.solver.PhaseConfig)

# Per-frame normalization
use_alpha: true   # divide out alpha_n before solving

# Gain
gain_mode: joint   # fit g_n jointly inside the method's own iteration ("none" fixes g_n=1)
g: null            # precomputed gain array; overrides gain_mode when set

# Method
method: aia_step_field
method_kwargs: {"iters": 30, "tol": 1.0e-4, "degree": 2, "refine_iters": 10, "refine_tol": 1.0e-4}
precise_reduce: false   # false halves peak memory on the few stack-scale reductions
